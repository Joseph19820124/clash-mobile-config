# Shadowrocket Config for iPhone
# 使用真实的代理节点配置
# 更新时间: 2026-06-06

# 基础配置
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
ipv6: false

# DNS 配置（Shadowrocket 兼容版本）
dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: redir-host
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  fallback:
    - 8.8.4.4
    - 1.0.0.1

# 代理节点定义 - 使用真实配置
proxies:
  # Trojan 节点 1
  - name: "xunmao-1"
    type: trojan
    server: 154.40.35.227
    port: 8443
    password: ab44c13e88d9d246eab11eff119e0d4e
    sni: proxy.gcp.chen-siyi.com
    skip-cert-verify: false
    udp: true

  # Trojan 节点 2
  - name: "xunmao-2"
    type: trojan
    server: 186.241.75.170
    port: 443
    password: trojan-go-pass-2026
    sni: www.microsoft.com
    skip-cert-verify: true
    udp: true

  # Hysteria2 节点（Taiwan）
  # 注：Shadowrocket 对 Hysteria2 支持有限，如不兼容请手动切换为 Trojan 节点
  - name: "Taiwan-Hysteria2"
    type: hysteria2
    server: 35.229.214.169
    port: 443
    password: 8+Al8z2dqh2TesJWGBJy5tY8fS6J14qe
    sni: taiwan-proxy-1
    skip-cert-verify: true
    udp: true

# 代理组（策略组）
proxy-groups:
  # 自动选择 - 会自动测试延迟并选择最快的
  - name: "Auto"
    type: url-test
    proxies:
      - "Taiwan-Hysteria2"
      - "xunmao-1"
      - "xunmao-2"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  # 手动选择
  - name: "Proxy"
    type: select
    proxies:
      - "Auto"
      - "Taiwan-Hysteria2"
      - "xunmao-1"
      - "xunmao-2"
      - "DIRECT"

# 规则配置
rules:
  # 私有地址直连
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT

  # 国内域名直连
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-SUFFIX,com.cn,DIRECT

  # 中国主要网站直连
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-SUFFIX,alibaba.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,weibo.com,DIRECT
  - DOMAIN-SUFFIX,163.com,DIRECT
  - DOMAIN-SUFFIX,bilibili.com,DIRECT

  # 兜底规则 - 其他流量都走代理
  - MATCH,Proxy
